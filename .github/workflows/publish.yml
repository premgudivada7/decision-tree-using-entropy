# Publishes to PyPI when a GitHub release is published.
# One-time setup on pypi.org: Account -> Publishing -> add a "pending publisher"
# (owner = your GitHub user, repo = decision-tree-using-entropy, workflow = publish.yml, environment = pypi).
name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
